[package]
name = "netscout-app"
version = "0.1.1"
edition = "2024"
authors = ["Tomáš Nesrsta"]
license = "AGPL-3.0-only"
repository = "https://github.com/Thomeless/netscout"
description = "NetScout: IP profily, sken sítě a neighbour discovery."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }
dns-lookup = "4.0.2"
opener = "0.9.0"
socket2 = { version = "0.6.5", features = ["all"] }
libloading = "0.9.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
